<script type="application/json" id="quiz-data">{"questions":[{"answers":[{"c":true,"t":"Wzrost."},{"c":true,"t":"Masa ciała."},{"c":false,"t":"Barwa oczu."},{"c":false,"t":"Niektóre choroby genetyczne."}],"e":"Wzrost i masa ciała są wynikiem działania genów i czynników środowiska. Barwa oczu wynika ze współdziałania kilku genów. Niektóre choroby genetyczne zależą od jednego genu.","multiple":true,"q":"Które z tych cech człowieka zależą zarówno od genów, jak i od czynników środowiska? Zaznacz wszystkie poprawne odpowiedzi."},{"answers":[{"c":false,"t":"Wynikają tylko z czynników środowiska."},{"c":true,"t":"Zależą od jednego genu."},{"c":false,"t":"Wynikają ze współdziałania wielu genów i środowiska."},{"c":false,"t":"Wynikają ze współdziałania kilku genów."}],"e":"Tylko nieliczne cechy człowieka zależą od jednego genu. Należą do nich niektóre choroby genetyczne. Większość cech, na przykład barwa oczu, wynika ze współdziałania kilku genów.","multiple":false,"q":"W jaki sposób dziedziczymy niektóre choroby genetyczne?"},{"answers":[{"c":false,"t":"Informacje o budowie tłuszczów, które tworzą błony komórkowe."},{"c":false,"t":"Informacje o ilości wody potrzebnej komórce."},{"c":true,"t":"Informacje o budowie białek, dzięki którym cechy mogą się ujawnić."},{"c":false,"t":"Informacje o tym, jakie pokarmy organizm powinien zjadać."}],"e":"Geny zawierają informacje o cechach organizmu, a dokładniej o budowie białek. To dzięki tym białkom, na przykład enzymom, cechy mogą się ujawnić.","multiple":false,"q":"Jakie informacje zawierają geny?"},{"answers":[{"c":false,"t":"W rybosomie."},{"c":false,"t":"W cytozolu."},{"c":false,"t":"W cząsteczce tRNA."},{"c":true,"t":"W jądrze komórkowym."}],"e":"mRNA powstaje w jądrze komórkowym. Potem przenika do cytozolu. Tam służy jako matryca do budowy białka.","multiple":false,"q":"Gdzie na podstawie informacji zapisanej w DNA powstaje cząsteczka mRNA?"},{"answers":[{"c":true,"t":"Transportują aminokwasy, które łączą się w odpowiedniej kolejności."},{"c":false,"t":"Przenoszą informację z DNA z jądra do cytozolu."},{"c":false,"t":"Zwijają gotowy łańcuch aminokwasów w białko."},{"c":false,"t":"Produkują melaninę odpowiedzialną za barwę oczu."}],"e":"tRNA przynoszą aminokwasy. Aminokwasy łączą się w odpowiedniej kolejności przy udziale rybosomów. Informację z jądra do cytozolu przenosi mRNA, a nie tRNA.","multiple":false,"q":"Jaką rolę pełnią cząsteczki tRNA podczas budowy białka?"},{"answers":[{"c":false,"t":"Wraca do jądra i łączy się z DNA."},{"c":true,"t":"Zwija się w określony sposób i tworzy w pełni funkcjonalne białko."},{"c":false,"t":"Rozpada się na pojedyncze aminokwasy."},{"c":false,"t":"Zamienia się w cząsteczkę mRNA."}],"e":"Powstały łańcuch aminokwasów zwija się w określony sposób. Dzięki temu tworzy się w pełni funkcjonalne białko, na przykład enzym biorący udział w produkcji melaniny.","multiple":false,"q":"Co dzieje się z łańcuchem aminokwasów, gdy oddzieli się od rybosomów?"},{"answers":[{"c":false,"t":"Enzymami, które łączą aminokwasy w rybosomach."},{"c":false,"t":"Genami odpowiedzialnymi za barwę oczu."},{"c":false,"t":"Cząsteczkami, które transportują aminokwasy do rybosomów."},{"c":true,"t":"Barwnikami odpowiedzialnymi na przykład za barwę oczu."}],"e":"Melaniny to barwniki, które odpowiadają na przykład za barwę oczu. Wytwarzają je enzymy, czyli białka. Melaniny nie są więc ani genami, ani enzymami.","multiple":false,"q":"Czym są melaniny?"},{"answers":[{"c":false,"t":"Ujawnia się tylko u homozygot recesywnych."},{"c":false,"t":"Ujawnia się tylko wtedy, gdy oboje rodzice mają ciemne włosy."},{"c":true,"t":"Ujawnia się u osób, które odziedziczyły po rodzicach allel dominujący."},{"c":false,"t":"Występuje u większości ludzi na świecie."}],"e":"Cecha dominująca ujawnia się u osób, które odziedziczyły allel dominujący. Mogą to być homozygoty dominujące albo heterozygoty. U homozygot recesywnych ujawnia się cecha recesywna, czyli jasne włosy.","multiple":false,"q":"Ciemna barwa włosów dopodobieństwo dziecka z piegami.","multiple":false,"q":"Oboje rodzice mają piegi i są heterozygotami (Aa). Jakie jest prawdopodobieństwo, że urodzi im się dziecko bez piegów?"},{"answers":[{"c":false,"t":"Może być AA albo Aa."},{"c":false,"t":"Jest heterozygotą Aa."},{"c":true,"t":"Jest homozygotą recesywną aa."},{"c":false,"t":"Jest homozygotą dominującą AA."}],"e":"Brak dołków to cecha recesywna. Cecha recesywna ujawnia się jedynie u homozygot recesywnych, więc mężczyzna musi mieć genotyp aa.","multiple":false,"q":"Mężczyzna nie ma dołków w policzkach. Jaki jest jego genotyp, jeśli dołki są cechą dominującą?"},{"answers":[{"c":true,"t":"Może być homozygotą dominującą AA albo heterozygotą Aa."},{"c":false,"t":"Na pewno jest heterozygotą Aa."},{"c":false,"t":"Na pewno jest homozygotą dominującą AA."},{"c":false,"t":"Może być heterozygotą Aa albo homozygotą recesywną aa."}],"e":"Cecha dominująca ujawnia się zarówno u homozygot dominujących, jak i u heterozygot. Dlatego przy obliczeniach trzeba rozpatrzyć oba przypadki.","multiple":false,"q":"Kobieta ma dołki w policzkach, ale nie znamy jej genotypu. Jaki genotyp może mieć?"},{"answers":[{"c":false,"t":"25%"},{"c":false,"t":"0%"},{"c":false,"t":"100%"},{"c":true,"t":"50%"}],"e":"Krzyżówka Aa × aa daje dwa razy Aa i dwa razy aa. Połowa możliwych dzieci to homozygoty recesywne bez dołków, czyli 50%.","multiple":false,"q":"Matka z dołkami w policzkach jest heterozygotą (Aa), a ojciec nie ma dołków (aa). Jakie jest prawdopodobieństwo urodzenia się dziecka bez dołków?"},{"answers":[{"c":false,"t":"Połowa dzieci może nie mieć dołków."},{"c":false,"t":"Jedna czwarta dzieci może nie mieć dołków."},{"c":true,"t":"Nie może urodzić się dziecko bez dołków, bo każde będzie miało genotyp Aa."},{"c":false,"t":"Wszystkie dzieci będą homozygotami recesywnymi bez dołków."}],"e":"Matka AA wytwarza tylko gamety A, a ojciec tylko gamety a. Każde dziecko będzie więc heterozygotą Aa z dołkami. Dziecko bez dołków nie może się urodzić.","multiple":false,"q":"Matka z dołkami w policzkach jest homozygotą dominującą (AA), a ojciec nie ma dołków (aa). Co można powiedzieć o ich dzieciach?"},{"answers":[{"c":false,"t":"Tak, z prawdopodobieństwem 25%, jeśli oboje są heterozygotami."},{"c":true,"t":"Nie, bo oboje są homozygotami recesywnymi aa i mają tylko allele a."},{"c":false,"t":"Tak, z prawdopodobieństwem 50%, bo jest to cecha dominująca."},{"c":false,"t":"Nie da się tego ustalić bez znajomości genotypów rodziców."}],"e":"Brak umiejętności zwijania języka to cecha recesywna, więc ujawnia się tylko u homozygot recesywnych aa. Rodzice nie mogą być heterozygotami, bo wtedy umieliby zwijać język. Mogą przekazać dziecku tylko allel a, więc każde dziecko będzie aa i nie będzie zwijać języka.","multiple":false,"q":"Oboje rodzice nie potrafią zwijać języka w rurkę. Przyjmij, że ta cecha jest dziedziczona jednogenowo. Czy mogą mieć dziecko, które potrafi zwijać język?"}],"text":{"again":"Spróbuj jeszcze raz","backToChapter":"Wróć do rozdziału","check":"Sprawdź","correct":"Dobrze!","next":"Następne pytanie","progress":"Pytanie {number} z {total}","score":"{score} / {total}","scoreLabel":"Twój wynik","seeResult":"Zobacz wynik","selectAll":"Zaznacz wszystkie poprawne odpowiedzi.","wrong":"Nie tym razem."}}</script>

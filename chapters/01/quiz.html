<script type="application/json" id="quiz-data">{"questions":[{"answers":[{"c":false,"t":"Budową i działaniem narządów człowieka."},{"c":true,"t":"Dziedziczeniem cech oraz zmiennością organizmów."},{"c":false,"t":"Wpływem środowiska na rozmieszczenie gatunków."},{"c":false,"t":"Klasyfikowaniem organizmów do gatunków."}],"e":"Genetyka to nauka zajmująca się dziedziczeniem cech oraz zmiennością organizmów. Pozostałe odpowiedzi opisują inne zagadnienia biologii, a nie przekazywanie cech i różnice między osobnikami.","multiple":false,"q":"Czym zajmuje się genetyka?"},{"answers":[{"c":true,"t":"Kolor skóry."},{"c":true,"t":"Umiejętność zwijania języka w rurkę."},{"c":false,"t":"Umiejętność czytania."},{"c":true,"t":"Rysy twarzy."}],"e":"Kolor skóry, rysy twarzy i umiejętność zwijania języka w rurkę odziedziczyliśmy po rodzicach, więc są cechami dziedzicznymi. Umiejętność czytania nabywamy w ciągu życia, dlatego jest cechą niedziedziczną.","multiple":true,"q":"Zaznacz wszystkie cechy, które rozdział podaje jako cechy dziedziczne."},{"answers":[{"c":false,"t":"Bo blizna to cecha gatunkowa człowieka."},{"c":false,"t":"Bo blizny przekazują dzieciom tylko matki."},{"c":true,"t":"Bo to cecha nabyta w ciągu życia pod wpływem środowiska."},{"c":false,"t":"Bo blizna jest zapisana w DNA tylko u dorosłych."}],"e":"Blizna jest cechą niedziedziczną: powstała w ciągu życia, gdy na organizm zadziałały czynniki środowiska. Takich cech nie przekazuje się potomstwu.","multiple":false,"q":"Tomek ma bliznę na kolanie po upadku z roweru. Dlaczego jego przyszłe dzieci nie odziedziczą tej blizny?"},{"answers":[{"c":false,"t":"Kolor oczu."},{"c":false,"t":"Brzmienie głosu."},{"c":false,"t":"Określony wzrost."},{"c":true,"t":"Wyprostowana postawa ciała."}],"e":"Wyprostowana postawa ciała, podobnie jak dwunożność i zdolność mowy, jest wspólna dla wszystkich ludzi z gatunku \u003cem>Homo sapiens\u003c/em>. Kolor oczu, wzrost i brzmienie głosu to cechy indywidualne, które odróżniają ludzi od siebie.","multiple":false,"q":"Która z poniższych cech jest cechą gatunkową człowieka, a nie cechą indywidualną?"},{"answers":[{"c":false,"t":"Zmiany wyglądu jednego osobnika w ciągu jego życia."},{"c":true,"t":"Występowanie różnic między osobnikami tego samego gatunku."},{"c":false,"t":"Powstawanie nowych gatunków z gatunków dawniejszych."},{"c":false,"t":"Różnice między organizmami należącymi do różnych gatunków."}],"e":"Zmienność to występowanie różnic między osobnikami tego samego gatunku. Nie chodzi o różnice między różnymi gatunkami ani o zmiany jednego osobnika z wiekiem.","multiple":false,"q":"Co w genetyce oznacza termin „zmienność”?"},{"answers":[{"c":false,"t":"Wyłącznie wpływ środowiska."},{"c":false,"t":"Wyłącznie rozmnażanie płciowe."},{"c":true,"t":"Rozmnażanie płciowe oraz wpływ środowiska."},{"c":false,"t":"Wyłącznie modyfikacje genetyczne."}],"e":"Zmienność wynika zarówno z rozmnażania płciowego, dzięki któremu potomstwo dziedziczy cechy po rodzicach, jak i z wpływu środowiska. Żaden z tych czynników nie działa sam.","multiple":false,"q":"Co według rozdziału jest źródłem zmienności organizmów?"},{"answers":[{"c":true,"t":"Że odpowiada za nie DNA, związek chemiczny obecny w jądrze komórkowym."},{"c":false,"t":"Że odpowiada za nie krew, która płynie od matki do dziecka."},{"c":false,"t":"Że cechy dziedziczne przekazuje się tylko w linii ojca."},{"c":false,"t":"Że odpowiadają za nie linie papilarne na opuszkach palców."}],"e":"W połowie XX wieku odkryto, że za przekazywanie cech dziedzicznych odpowiada kwas deoksyrybonukleinowy (DNA) znajdujący się w jądrze komórkowym. To odkrycie było przełomowe i umożliwiło kolejne odkrycia w wielu dziedzinach.","multiple":false,"q":"Co odkryto w połowie XX wieku na temat przekazywania cech dziedzicznych?"},{"answers":[{"c":false,"t":"Pozwala zmienić kolor oczu przed narodzinami dziecka."},{"c":true,"t":"Pozwala sprawdzić podatność na niektóre choroby, np. nowotworowe."},{"c":false,"t":"Pozwala usunąć blizny, które powstały w ciągu życia."},{"c":false,"t":"Pozwala ustalić wiek kości znalezionych w ziemi."}],"e":"Analiza DNA pozwala stwierdzić, czy dana osoba jest podatna na niektóre choroby, np. nowotworowe. Dzięki temu ta osoba może zmienić tryb życia, aby zmniejszyć ryzyko zachorowania.","multiple":false,"q":"Jak według rozdziału analiza DNA może pomóc w medycynie?"},{"answers":[{"c":false,"t":"Badać DNA tylko u organizmów, które obecnie żyją."},{"c":false,"t":"Ożywiać osobniki wymarłe tysiące lat temu."},{"c":true,"t":"Badać kopalne DNA osobników wymarłych setki lub tysiące lat temu."},{"c":false,"t":"Ustalać sprawców przestępstw na podstawie śladów krwi."}],"e":"Do niedawna można było badać tylko materiał genetyczny żyjących organizmów. Dziś bada się też kopalne DNA osobników wymarłych dawno temu, co daje informacje np. o cechach ludzi pierwotnych. Ustalanie sprawców przestępstw należy do kryminalistyki, nie do archeologii.","multiple":false,"q":"Czego nowego mogą dziś dokonywać badacze w archeologii dzięki genetyce?"},{"answers":[{"c":true,"t":"Włos."},{"c":true,"t":"Ślina."},{"c":true,"t":"Plama krwi."},{"c":false,"t":"Odbicie linii papilarnych z opuszka palca."}],"e":"Włos, ślina i plama krwi zawierają komórki, z których naukowcy uzyskują materiał genetyczny. Mimo swojej nazwy genetyczny odcisk palca nie wymaga linii papilarnych z opuszka.","multiple":true,"q":"Zaznacz wszystkie ślady, które według rozdziału wystarczą do wykonania „genetycznego odcisku palca”."},{"answers":[{"c":false,"t":"Wprowadza do krów modyfikacje genetyczne."},{"c":false,"t":"Wywołuje u krów cechy niedziedziczne."},{"c":true,"t":"Dobiera do rozrodu wartościowe osobniki, intuicyjnie korzystając z genetyki."},{"c":false,"t":"Krzyżuje ze sobą osobniki dwóch różnych gatunków."}],"e":"Od tysięcy lat ludzie obserwowali zwierzęta i dopuszczali do rozrodu tylko osobniki wartościowe dla hodowli, np. mleczne krowy. W ten sposób intuicyjnie wykorzystywali genetykę. To nie jest modyfikacja genetyczna ani krzyżowanie różnych gatunków.","multiple":false,"q":"Rolnik pozwala rozmnażać się tylko krowom, które dają najwięcej mleka. Co w ten sposób robi?"},{"answers":[{"c":true,"t":"Skrzyżował ze sobą rośliny dwóch różnych gatunków: pszenicę i żyto."},{"c":false,"t":"Wybierał do uprawy tylko najwyższe rośliny pszenicy."},{"c":false,"t":"Badał kopalne DNA dawnych zbóż."},{"c":false,"t":"Hodował żyto w specjalnych warunkach środowiska."}],"e":"Pszenżyto powstało ze skrzyżowania pszenicy i żyta, czyli roślin należących do różnych gatunków. Dlatego to zboże ma cechy zarówno pszenicy, jak i żyta.","multiple":false,"q":"W jaki sposób człowiek otrzymał pszenżyto?"},{"answers":[{"c":false,"t":"Wyłącznie wybieranie najlepszych roślin do dalszej uprawy."},{"c":true,"t":"Wyhodowanie roślin o zupełnie nowych cechach, np. pomidorów dłużej zachowujących świeżość."},{"c":false,"t":"Przekazywanie roślinom cech niedziedzicznych nabytych w ciągu życia."},{"c":false,"t":"Badanie, czy rośliny są podatne na choroby nowotworowe."}],"e":"Dzięki modyfikacjom genetycznym można wyhodować rośliny o zupełnie nowych cechach, np. pomidory, których owoce dłużej zachowują świeżość, albo kukurydzę o kolorowych, ozdobnych kolbach. Samo wybieranie najlepszych roślin to dawna, intuicyjna metoda, a nie modyfikacja genetyczna.","multiple":false,"q":"Co według rozdziału umożliwiają dziś modyfikacje genetyczne w uprawie roślin?"}],"text":{"again":"Spróbuj jeszcze raz","backToChapter":"Wróć do rozdziału","check":"Sprawdź","correct":"Dobrze!","next":"Następne pytanie","progress":"Pytanie {number} z {total}","score":"{score} / {total}","scoreLabel":"Twój wynik","seeResult":"Zobacz wynik","selectAll":"Zaznacz wszystkie poprawne odpowiedzi.","wrong":"Nie tym razem."}}</script>

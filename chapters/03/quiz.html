<script type="application/json" id="quiz-data">{"questions":[{"answers":[{"c":false,"t":"Komórka potomna"},{"c":true,"t":"Komórka macierzysta"},{"c":false,"t":"Komórka haploidalna"},{"c":false,"t":"Komórka rozrodcza"}],"e":"Komórka, która ulega podziałowi, to komórka macierzysta, a nowe komórki, które z niej powstają, to komórki potomne. Komórka potomna to więc wynik podziału, a nie komórka, która się dzieli.","multiple":false,"q":"Komórka skóry podzieliła się i powstały z niej dwie nowe komórki. Jak nazywamy komórkę, która uległa podziałowi?"},{"answers":[{"c":false,"t":"Umożliwia wzrost ciała tego organizmu."},{"c":true,"t":"Jest sposobem rozmnażania, bo z jednego organizmu powstają dwa nowe."},{"c":false,"t":"Służy wyłącznie do wytwarzania gamet."},{"c":false,"t":"Pozwala na odtwarzanie uszkodzonych tkanek."}],"e":"U organizmów jednokomórkowych, takich jak drożdże, podział komórki jest sposobem rozmnażania: z jednego organizmu powstają dwa nowe. Wzrost ciała i tworzenie komórek rozrodczych to znaczenie podziałów u organizmów wielokomórkowych.","multiple":false,"q":"Jakie znaczenie ma podział komórki dla organizmu jednokomórkowego, np. drożdży?"},{"answers":[{"c":false,"t":"To dwie identyczne chromatydy, które powstają w wyniku replikacji DNA."},{"c":false,"t":"To wszystkie chromosomy odziedziczone po jednym z rodziców."},{"c":true,"t":"To odpowiadające sobie chromosomy z zestawu od matki i zestawu od ojca, o tej samej wielkości i kształcie, z genami tych samych cech."},{"c":false,"t":"To chromosomy, które występują tylko w plemnikach i komórkach jajowych."}],"e":"Chromosomy homologiczne to odpowiadające sobie chromosomy z dwóch zestawów, jednego od matki i jednego od ojca. Mają taką samą wielkość i kształt i zawierają geny warunkujące te same cechy. Dwie identyczne chromatydy to dwie części jednego chromosomu po replikacji, a nie para homologiczna.","multiple":false,"q":"Czym są chromosomy homologiczne?"},{"answers":[{"c":true,"t":"Komórka jajowa"},{"c":false,"t":"Komórka naskórka"},{"c":true,"t":"Plemnik"},{"c":false,"t":"Komórka kości (komórka somatyczna)"}],"e":"Komórki jajowe i plemniki są haploidalne, czyli mają pojedynczy zestaw chromosomów. Komórki naskórka i inne komórki somatyczne mają podwójny zestaw chromosomów, czyli są diploidalne.","multiple":true,"q":"Które z wymienionych komórek człowieka są haploidalne? Zaznacz wszystkie poprawne odpowiedzi."},{"answers":[{"c":false,"t":"Diploidalna, 2n"},{"c":false,"t":"Haploidalna, 2n"},{"c":false,"t":"Diploidalna, n"},{"c":true,"t":"Haploidalna, n"}],"e":"Komórka z pojedynczym zestawem chromosomów jest haploidalna i oznacza się ją symbolem n. Symbol 2n oznacza komórkę diploidalną, która ma podwójny zestaw chromosomów.","multiple":false,"q":"Komórka ma w jądrze pojedynczy zestaw chromosomów, po jednym chromosomie z każdej pary homologicznej. Jak ją nazywamy i jakim symbolem ją oznaczamy?"},{"answers":[{"c":false,"t":"Podział cytoplazmy"},{"c":true,"t":"Replikacja, czyli wytworzenie kopii DNA"},{"c":false,"t":"Wymiana fragmentów DNA między chromosomami homologicznymi"},{"c":false,"t":"Połączenie się dwóch gamet w zygotę"}],"e":"Podział jądra zawsze poprzedza replikacja, czyli wytworzenie kopii DNA. Dzięki niej każdy chromosom składa się z dwóch identycznych cząsteczek. Podział cytoplazmy jest drugim etapem podziału komórki, a nie pierwszym.","multiple":false,"q":"Co zawsze poprzedza podział jądra komórkowego?"},{"answers":[{"c":false,"t":"Cztery komórki haploidalne"},{"c":false,"t":"Dwie komórki diploidalne"},{"c":true,"t":"Dwie komórki haploidalne o materiale genetycznym identycznym z komórką macierzystą"},{"c":false,"t":"Dwie komórki o połowę mniejszej liczbie chromosomów niż komórka macierzysta"}],"e":"W mitozie komórki potomne mają tyle samo materiału genetycznego co komórka macierzysta. Dlatego z komórki haploidalnej powstają dwie identyczne komórki haploidalne. Zmniejszenie liczby chromosomów o połowę i powstanie czterech komórek to cechy mejozy.","multiple":false,"q":"Mitozie ulega komórka haploidalna. Jakie komórki z niej powstaną?"},{"answers":[{"c":true,"t":"Do gojenia się ran i odrastania ogona u jaszczurki"},{"c":true,"t":"Do wzrostu włosów i paznokci"},{"c":false,"t":"Do wytwarzania plemników i komórek jajowych"},{"c":true,"t":"Do rozmnażania bezpłciowego ameby"}],"e":"Mitoza umożliwia rozmnażanie bezpłciowe organizmów jednokomórkowych, np. ameby. Pozwala też na gojenie ran, odtwarzanie tkanek, wytwarzanie komórek ciała oraz wzrost ciała i jego części, np. włosów i paznokci. Gamety, czyli plemniki i komórki jajowe, powstają w wyniku mejozy.","multiple":true,"q":"Do czego służy mitoza? Zaznacz wszystkie poprawne odpowiedzi."},{"answers":[{"c":false,"t":"Wytwarza kopię DNA przed podziałem."},{"c":false,"t":"Otacza jądro komórkowe i chroni chromosomy."},{"c":true,"t":"Dzięki niemu chromosomy przemieszczają się podczas podziału komórki."},{"c":false,"t":"Rozdziela cytoplazmę na dwie komórki potomne."}],"e":"Wrzeciono podziałowe to struktura, dzięki której chromosomy przemieszczają się podczas podziału. Jego włókna łączą się z chromosomami i odciągają je do przeciwległych biegunów komórki. Jądro otacza otoczka jądrowa, która podczas podziału zanika.","multiple":false,"q":"Jaką rolę pełni wrzeciono podziałowe w dzielącej się komórce?"},{"answers":[{"c":false,"t":"Łączą się w pary z chromosomami homologicznymi."},{"c":true,"t":"Są odciągane do przeciwległych biegunów komórki i każda staje się odrębnym chromosomem."},{"c":false,"t":"Ustawiają się w płaszczyźnie równikowej i wymieniają się fragmentami DNA."},{"c":false,"t":"Zanikają, a wokół nich tworzy się nowa cytoplazma."}],"e":"Po oddzieleniu się chromatydy są odciągane przez wrzeciono podziałowe do przeciwległych biegunów komórki. Od tego momentu każda chromatyda jest odrębnym chromosomem. Chromosomy ustawiają się w płaszczyźnie równikowej wcześniej, a wymiana fragmentów DNA zachodzi w mejozie, a nie w mitozie.","multiple":false,"q":"Co się dzieje w mitozie, gdy chromatydy oddzielają się od siebie?"},{"answers":[{"c":false,"t":"Ponieważ wtedy nie mogłyby się poruszać."},{"c":true,"t":"Ponieważ zygota powstała z ich połączenia miałaby dwa razy więcej materiału genetycznego."},{"c":false,"t":"Ponieważ nie mogłyby wtedy zajść w nich replikacja."},{"c":false,"t":"Ponieważ komórki potomne byłyby wtedy haploidalne."}],"e":"Gdyby gamety miały tyle samo DNA co komórki somatyczne, zygota powstała z ich połączenia miałaby dwa razy więcej materiału genetycznego. Zapobiega temu powstawanie gamet w podziale redukcyjnym, czyli w mejozie.","multiple":false,"q":"Dlaczego gamety nie mogą mieć tyle samo DNA co pozostałe komórki ciała?"},{"answers":[{"c":false,"t":"Z jednej komórki diploidalnej powstają dwie komórki diploidalne."},{"c":false,"t":"Z jednej komórki haploidalnej powstają cztery komórki diploidalne."},{"c":true,"t":"Z jednej komórki diploidalnej powstają cztery komórki haploidalne."},{"c":false,"t":"Z jednej komórki diploidalnej powstają dwie identyczne komórki haploidalne."}],"e":"Mejoza składa się z dwóch kolejnych podziałów i prowadzi do powstania czterech komórek haploidalnych z jednej komórki diploidalnej. Dwie komórki potomne z tą samą liczbą chromosomów co komórka macierzysta to wynik mitozy.","multiple":false,"q":"Jaki jest efekt mejozy?"},{"answers":[{"c":false,"t":"W pierwszym podziale chromatydy, a w drugim chromosomy homologiczne"},{"c":true,"t":"W pierwszym podziale chromosomy z każdej pary homologicznej, a w drugim chromatydy"},{"c":false,"t":"W obu podziałach rozdzielane są chromatydy"},{"c":false,"t":"W obu podziałach rozdzielane są chromosomy homologiczne"}],"e":"W pierwszym podziale mejozy chromosomy z każdej pary homologicznej trafiają do przeciwległych biegunów. Powstają dwie komórki z pojedynczym zestawem chromosomów, a każdy z nich ma dwie chromatydy. W drugim podziale rozdzielane są właśnie te chromatydy.","multiple":false,"q":"Co jest rozdzielane do komórek potomnych podczas pierwszego, a co podczas drugiego podziału mejozy?"},{"answers":[{"c":true,"t":"Wymiana fragmentów DNA między chromosomami homologicznymi"},{"c":false,"t":"Replikacja DNA przed podziałem"},{"c":true,"t":"Losowe rozdzielanie chromosomów między komórki potomne"},{"c":false,"t":"Zanikanie otoczki jądrowej"}],"e":"Rekombinacja genetyczna wynika z wymiany fragmentów DNA między chromosomami homologicznymi oraz z losowego rozdzielania chromosomów między komórki potomne. Dzięki temu każda gameta jest niepowtarzalna. Replikacja tworzy tylko identyczne kopie DNA, więc nie miesza genów.","multiple":true,"q":"Które procesy zachodzące w mejozie powodują rekombinację genetyczną, czyli mieszanie się genów od ojca i od matki? Zaznacz wszystkie poprawne odpowiedzi."},{"answers":[{"c":false,"t":"W obu procesach dochodzi do dwóch podziałów."},{"c":false,"t":"Oba procesy służą do wytwarzania gamet."},{"c":true,"t":"W obu procesach przed podziałem następuje replikacja DNA."},{"c":false,"t":"W obu procesach komórki potomne mają o połowę mniej chromosomów."}],"e":"Zarówno mitozę, jak i mejozę poprzedza replikacja DNA. Pozostałe cechy je różnią: w mitozie jest jeden podział, który daje komórki somatyczne z niezmienioną liczbą chromosomów. W mejozie są dwa podziały, które dają gamety o połowę mniejszej liczbie chromosomów.","multiple":false,"q":"Która cecha jest wspólna dla mitozy i mejozy?"}],"text":{"again":"Spróbuj jeszcze raz","backToChapter":"Wróć do rozdziału","check":"Sprawdź","correct":"Dobrze!","next":"Następne pytanie","progress":"Pytanie {number} z {total}","score":"{score} / {total}","scoreLabel":"Twój wynik","seeResult":"Zobacz wynik","selectAll":"Zaznacz wszystkie poprawne odpowiedzi.","wrong":"Nie tym razem."}}</script>

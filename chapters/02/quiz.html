<script type="application/json" id="quiz-data">{"questions":[{"answers":[{"c":false,"t":"Zbiorem wszystkich białek, które wytwarza komórka organizmu."},{"c":true,"t":"Zapisem wszystkich cech dziedzicznych organizmu."},{"c":false,"t":"Zestawem chromosomów charakterystycznym dla danego gatunku."},{"c":false,"t":"Kolejnością aminokwasów w enzymach trawiennych żołądka."}],"e":"Informacja genetyczna to zapis wszystkich cech dziedzicznych organizmu, a jej nośnikiem jest DNA. Zestaw chromosomów charakterystyczny dla gatunku to kariotyp, a nie informacja genetyczna.","multiple":false,"q":"Czym jest informacja genetyczna?"},{"answers":[{"c":false,"t":"Całą cząsteczkę DNA zawartą w jądrze komórkowym."},{"c":false,"t":"Pojedynczy nukleotyd zawierający jedną zasadę azotową."},{"c":true,"t":"Odcinek DNA zawierający informację o budowie białka."},{"c":false,"t":"Połówkę chromosomu połączoną z drugą centromerem."}],"e":"Gen to odcinek DNA, który zawiera informację o budowie białka, np. aktyny, miozyny albo enzymu trawiennego. Jedna cząsteczka DNA zawiera wiele różnych genów, dlatego gen nie jest całą cząsteczką DNA. Połówka chromosomu to chromatyda.","multiple":false,"q":"Co według podręcznika oznacza termin „gen”?"},{"answers":[{"c":false,"t":"Geny stanowią 98% DNA, a pozostałe 2% nie ma żadnej funkcji."},{"c":false,"t":"Całe DNA składa się z genów, z których każdy koduje jedno białko."},{"c":false,"t":"Geny stanowią połowę DNA, a druga połowa reguluje ich odczytywanie."},{"c":true,"t":"Geny stanowią około 2% DNA, a część pozostałych odcinków reguluje odczytywanie genów."}],"e":"Geny to jedynie 2% całego DNA. Pozostałe 98% nie koduje cech. Część tych odcinków reguluje odczytywanie informacji z genów, a funkcje niektórych fragmentów wciąż nie są znane.","multiple":false,"q":"Które zdanie poprawnie opisuje udział genów w całym DNA?"},{"answers":[{"c":true,"t":"W genach zapisana jest budowa enzymów, które wytwarzają melaniny nadające kolor skórze."},{"c":false,"t":"Melaniny są odcinkami DNA, które bezpośrednio barwią skórę."},{"c":false,"t":"Kolor skóry zależy od liczby chromosomów w komórkach skóry."},{"c":false,"t":"Barwniki skóry powstają z niekodujących 98% DNA, a nie z genów."}],"e":"Zgodnie ze schematem gen → białko → cecha w genach zapisana jest budowa enzymów odpowiedzialnych za wytwarzanie melanin. Melaniny to barwniki nadające kolor skórze, włosom i tęczówkom. Same melaniny nie są odcinkami DNA.","multiple":false,"q":"Dwie osoby różnią się kolorem skóry. Jak, zgodnie z podręcznikiem, ta różnica wiąże się z ich genami?"},{"answers":[{"c":true,"t":"Deoksyryboza."},{"c":true,"t":"Reszta kwasu fosforowego."},{"c":true,"t":"Zasada azotowa."},{"c":false,"t":"Ryboza."}],"e":"Nukleotyd DNA tworzą: cukier deoksyryboza, reszta kwasu fosforowego i jedna z czterech zasad azotowych (A, T, C lub G). Ryboza występuje w nukleotydach RNA, a nie DNA.","multiple":true,"q":"Zaznacz wszystkie składniki, które budują pojedynczy nukleotyd DNA."},{"answers":[{"c":false,"t":"Składa się z dwóch chromatyd połączonych centromerem."},{"c":true,"t":"Składa się z dwóch nici ułożonych równolegle i spiralnie skręconych wokół wspólnej osi."},{"c":false,"t":"Jest to jedna nić zwinięta dwukrotnie wokół białek."},{"c":false,"t":"Zawiera dwa rodzaje cukru: deoksyrybozę i rybozę."}],"e":"Podwójna helisa to dwie nici DNA ułożone równolegle i spiralnie skręcone wokół wspólnej osi. Dwie chromatydy połączone centromerem to opis chromosomu w dzielącej się komórce, a nie helisy.","multiple":false,"q":"Co oznacza, że cząsteczka DNA ma postać podwójnej helisy?"},{"answers":[{"c":false,"t":"Liczbą nukleotydów w jednym genie."},{"c":false,"t":"Sposobem zwinięcia DNA wokół białek."},{"c":true,"t":"Ściśle określoną kolejnością nukleotydów w nici DNA."},{"c":false,"t":"Kolejnością etapów replikacji DNA."}],"e":"Nukleotydy w nici DNA są połączone w ściśle określonej kolejności, którą nazywamy sekwencją DNA. Od tej sekwencji zależą cechy organizmu.","multiple":false,"q":"Czym jest sekwencja DNA?"},{"answers":[{"c":false,"t":"ATTGACG"},{"c":false,"t":"GCCATGA"},{"c":false,"t":"TAAGTCG"},{"c":true,"t":"TAACTGC"}],"e":"Zgodnie z zasadą komplementarności adenina łączy się zawsze z tyminą, a cytozyna z guaniną. Dlatego naprzeciw A–T–T–G–A–C–G leżą T–A–A–C–T–G–C. Sekwencja jednej nici wyznacza więc sekwencję drugiej.","multiple":false,"q":"Jedna nić DNA ma sekwencję ATTGACG. Jaka jest sekwencja nici leżącej naprzeciw niej?"},{"answers":[{"c":false,"t":"W rybosomach."},{"c":true,"t":"W jądrze komórkowym."},{"c":false,"t":"W błonie komórkowej."},{"c":false,"t":"Wyłącznie w cytoplazmie."}],"e":"DNA znajduje się w jądrze komórkowym, które kieruje wszystkimi procesami zachodzącymi w komórce. Rybosomy są budowane przez rRNA i łączą aminokwasy w białka.","multiple":false,"q":"Gdzie w komórce znajduje się DNA?"},{"answers":[{"c":false,"t":"Ponieważ bez upakowania nukleotydy oddzieliłyby się od siebie."},{"c":false,"t":"Ponieważ tylko upakowane DNA zawiera geny."},{"c":true,"t":"Ponieważ w jednej komórce człowieka jest łącznie ponad dwa metry nici DNA, a jądro jest niewielkie."},{"c":false,"t":"Ponieważ upakowanie zamienia DNA w RNA potrzebne do wytwarzania białek."}],"e":"W jednej komórce człowieka znajdują się łącznie ponad dwa metry nici DNA. Aby zmieściły się w małym jądrze komórkowym, muszą być zwinięte, czyli upakowane.","multiple":false,"q":"Dlaczego DNA w jądrze komórkowym musi być upakowane?"},{"answers":[{"c":false,"t":"Centromer."},{"c":false,"t":"Kariotyp."},{"c":false,"t":"Nukleotyd."},{"c":true,"t":"Chromatyna."}],"e":"DNA w połączeniu z białkami nosi nazwę chromatyny. Najbardziej upakowaną postacią chromatyny jest chromosom. Centromer to tylko miejsce połączenia chromatyd.","multiple":false,"q":"Jak nazywa się DNA połączone z białkami, które pomagają je zwinąć w grube włókno?"},{"answers":[{"c":false,"t":"Przez cały czas życia komórki."},{"c":true,"t":"Jedynie wtedy, gdy komórka się dzieli."},{"c":false,"t":"Tylko w momencie zapłodnienia."},{"c":false,"t":"Tylko wtedy, gdy komórka wytwarza białka."}],"e":"DNA w jądrze komórkowym występuje zazwyczaj w formie nici. Postać chromosomu, czyli najbardziej zwartą strukturę, przyjmuje jedynie wtedy, gdy komórka się dzieli.","multiple":false,"q":"Kiedy DNA w jądrze komórkowym przyjmuje postać chromosomów?"},{"answers":[{"c":false,"t":"Liczbą genów zawartych w jednym chromosomie."},{"c":false,"t":"Pojedynczym chromosomem w kształcie litery X."},{"c":false,"t":"Zestawem wszystkich białek charakterystycznych dla danego gatunku."},{"c":true,"t":"Kompletnym zestawem chromosomów charakterystycznym dla gatunku."}],"e":"Kariotyp to kompletny zestaw chromosomów charakterystyczny dla gatunku. Kariotyp człowieka zawiera 46 chromosomów, a kariotyp psa 78 chromosomów.","multiple":false,"q":"Czym jest kariotyp?"},{"answers":[{"c":false,"t":"23"},{"c":true,"t":"46"},{"c":false,"t":"78"},{"c":false,"t":"92"}],"e":"Kariotyp człowieka zawiera 46 chromosomów. Liczba 78 to kariotyp psa, co pokazuje, że każdy gatunek ma określoną liczbę chromosomów.","multiple":false,"q":"Ile chromosomów zawiera kariotyp człowieka?"},{"answers":[{"c":true,"t":"Składa się z dwóch chromatyd połączonych centromerem, a każda chromatyda zawiera jedną cząsteczkę DNA."},{"c":false,"t":"Składa się z dwóch centromerów połączonych chromatydą, która zawiera całe DNA komórki."},{"c":false,"t":"Składa się z dwóch chromatyd, które razem zawierają jedną cząsteczkę DNA."},{"c":false,"t":"Składa się z czterech chromatyd, z których każda jest osobnym genem."}],"e":"Chromosom w dzielącej się komórce składa się z dwóch podłużnych połówek, czyli chromatyd. Każda chromatyda zawiera jedną cząsteczkę DNA, a miejsce ich połączenia to centromer.","multiple":false,"q":"Które zdanie poprawnie opisuje budowę chromosomu w dzielącej się komórce?"},{"answers":[{"c":false,"t":"Aby powstały nowe geny, których komórka wcześniej nie miała."},{"c":false,"t":"Aby zamienić DNA w RNA i przenieść je do cytoplazmy."},{"c":true,"t":"Aby komórki potomne nie miały o połowę mniej materiału genetycznego."},{"c":false,"t":"Aby zmniejszyć liczbę chromosomów w komórce o połowę."}],"e":"Replikacja to proces tworzenia kopii DNA. Bez niej komórki potomne miałyby o połowę mniejszą zawartość materiału genetycznego niż komórka macierzysta.","multiple":false,"q":"Dlaczego przed podziałem komórki konieczna jest replikacja DNA?"},{"answers":[{"c":false,"t":"Jedna cząsteczka z dwiema nowymi nićmi i jedna z dwiema starymi."},{"c":false,"t":"Dwie różne cząsteczki, każda zbudowana tylko z nowych nukleotydów."},{"c":false,"t":"Jedna cząsteczka DNA i jedna cząsteczka RNA."},{"c":true,"t":"Dwie identyczne cząsteczki, każda zawierająca jedną nić starą i jedną nową."}],"e":"Podczas replikacji helisa jest rozplatana, a do każdej nici dołączane są wolne nukleotydy zgodnie z regułą komplementarności. Powstają dwie identyczne cząsteczki DNA, z których każda ma jedną nić starą i jedną nową.","multiple":false,"q":"Jaki jest wynik replikacji jednej cząsteczki DNA?"},{"answers":[{"c":false,"t":"Dwie nici sprawiają, że DNA nie musi być rozplatane podczas replikacji."},{"c":true,"t":"Każda nić może posłużyć jako wzór, do którego dołącza się komplementarne nukleotydy."},{"c":false,"t":"Jedna nić zawiera geny, a druga reguluje ich odczytywanie."},{"c":false,"t":"Dzięki dwóm niciom DNA może zostać zamienione w dwie cząsteczki RNA."}],"e":"Po rozdzieleniu nici do każdej z nich dołączane są wolne nukleotydy zgodnie z regułą komplementarności. Sekwencja jednej nici wyznacza sekwencję drugiej, dlatego powstają dwie identyczne cząsteczki. Helisa musi być przy tym rozplatana.","multiple":false,"q":"Jakie znaczenie dla replikacji ma to, że DNA jest dwuniciowy?"},{"answers":[{"c":true,"t":"Nukleotydy RNA zawierają rybozę zamiast deoksyrybozy."},{"c":true,"t":"RNA zawiera uracyl zamiast tyminy."},{"c":true,"t":"RNA jest przeważnie jednoniciowy."},{"c":false,"t":"RNA nie zawiera reszty kwasu fosforowego."}],"e":"Nukleotydy RNA zawierają rybozę zamiast deoksyrybozy i uracyl zamiast tyminy, a sam RNA jest przeważnie jednoniciowy. Reszta kwasu fosforowego występuje jednak zarówno w nukleotydach RNA, jak i DNA.","multiple":true,"q":"Zaznacz wszystkie cechy, którymi RNA różni się od DNA."},{"answers":[{"c":true,"t":"mRNA"},{"c":false,"t":"tRNA"},{"c":false,"t":"rRNA"},{"c":false,"t":"DNA"}],"e":"Informacje o budowie białek z jądra do cytoplazmy przenosi mRNA. tRNA dostarcza aminokwasy do miejsca syntezy białek, a rRNA buduje rybosomy, które łączą aminokwasy w łańcuchy białkowe.","multiple":false,"q":"Który rodzaj RNA przenosi informacje o budowie białek z jądra do cytoplazmy?"}],"text":{"again":"Spróbuj jeszcze raz","backToChapter":"Wróć do rozdziału","check":"Sprawdź","correct":"Dobrze!","next":"Następne pytanie","progress":"Pytanie {number} z {total}","score":"{score} / {total}","scoreLabel":"Twój wynik","seeResult":"Zobacz wynik","selectAll":"Zaznacz wszystkie poprawne odpowiedzi.","wrong":"Nie tym razem."}}</script>

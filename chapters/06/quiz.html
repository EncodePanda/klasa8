<script type="application/json" id="quiz-data">{"questions":[{"answers":[{"c":false,"t":"Z 23 par chromosomów autosomalnych i jednego chromosomu płci."},{"c":true,"t":"Z 22 par chromosomów autosomalnych i jednej pary chromosomów płci."},{"c":false,"t":"Z 21 par chromosomów autosomalnych i dwóch par chromosomów płci."},{"c":false,"t":"Z 22 par chromosomów płci i jednej pary chromosomów autosomalnych."}],"e":"Kariotyp człowieka obejmuje 22 pary chromosomów autosomalnych i jedną, 23. parę chromosomów płci. Razem daje to 46 chromosomów. Chromosomy płci to tylko jedna para, a nie większość kariotypu.","multiple":false,"q":"Z czego składa się kariotyp człowieka, czyli zestaw 46 chromosomów?"},{"answers":[{"c":false,"t":"Tylko chromosomy X, które występują u obu płci."},{"c":false,"t":"Chromosomy, które występują wyłącznie w gametach."},{"c":true,"t":"Wszystkie chromosomy, które nie są związane z płcią."},{"c":false,"t":"Chromosomy, które różnią się u kobiet i u mężczyzn."}],"e":"Chromosomami autosomalnymi nazywamy wszystkie chromosomy niezwiązane z płcią. Jest ich 22 pary i u kobiet oraz u mężczyzn są one takie same. Różni się tylko para chromosomów płci.","multiple":false,"q":"Które chromosomy nazywamy autosomalnymi?"},{"answers":[{"c":false,"t":"Dwa chromosomy X."},{"c":false,"t":"Dwa chromosomy Y."},{"c":false,"t":"Jeden chromosom X i jedną parę chromosomów Y."},{"c":true,"t":"Jeden chromosom X i jeden chromosom Y."}],"e":"U mężczyzn 23. parę tworzą dwa różne chromosomy: X i Y. Dwa chromosomy X ma kobieta.","multiple":false,"q":"Jaką parę chromosomów płci ma mężczyzna?"},{"answers":[{"c":true,"t":"Geny warunkujące krzepnięcie krwi."},{"c":true,"t":"Geny warunkujące rozróżnianie barw."},{"c":true,"t":"Geny warunkujące funkcjonowanie komórek mięśniowych."},{"c":false,"t":"Geny warunkujące rozwój męskich cech płciowych."}],"e":"W chromosomie X znajdują się między innymi geny krzepnięcia krwi, rozróżniania barw, funkcjonowania komórek mięśniowych oraz rozwoju żeńskich cech płciowych. Geny warunkujące rozwój męskich cech płciowych leżą w chromosomie Y.","multiple":true,"q":"Które geny według rozdziału znajdują się w chromosomie X? Zaznacz wszystkie poprawne odpowiedzi."},{"answers":[{"c":false,"t":"Od tego, czy komórka jajowa zawiera chromosom X, czy Y."},{"c":true,"t":"Od tego, czy z komórką jajową połączy się plemnik z chromosomem X, czy z chromosomem Y."},{"c":false,"t":"Od liczby chromosomów autosomalnych w plemniku."},{"c":false,"t":"Od tego, czy allele w zygocie są dominujące, czy recesywne."}],"e":"Komórka jajowa zawsze otrzymuje chromosom X, a plemnik może zawierać chromosom X albo Y. Plemnik z chromosomem X daje dziewczynkę, a plemnik z chromosomem Y daje chłopca. O płci decyduje więc plemnik, a nie komórka jajowa.","multiple":false,"q":"Od czego zależy płeć dziecka?"},{"answers":[{"c":false,"t":"Dziewczynka urodzi się z prawdopodobieństwem 75%, a chłopiec 25%."},{"c":false,"t":"Chłopiec urodzi się z prawdopodobieństwem 75%, a dziewczynka 25%."},{"c":true,"t":"Dziewczynka i chłopiec urodzą się z takim samym prawdopodobieństwem, po 50%."},{"c":false,"t":"Zawsze urodzi się dziewczynka, bo matka przekazuje tylko chromosom X."}],"e":"Matka wytwarza wyłącznie gamety X, a ojciec gamety X i Y. W krzyżówce wychodzą dwa wyniki XX i dwa wyniki XY, czyli po 50% dla każdej płci. To, że matka przekazuje tylko X, nie przesądza o płci, bo drugi chromosom pochodzi od ojca.","multiple":false,"q":"Matka ma chromosomy płci XX, a ojciec XY. Jakie wyniki daje krzyżówka genetyczna dotycząca płci ich dziecka?"},{"answers":[{"c":false,"t":"Cechy, które decydują o tym, czy człowiek jest kobietą, czy mężczyzną."},{"c":true,"t":"Cechy niedotyczące płci, kodowane przez geny leżące w chromosomie X."},{"c":false,"t":"Cechy kodowane przez geny leżące w chromosomach autosomalnych."},{"c":false,"t":"Cechy kodowane wyłącznie przez geny leżące w chromosomie Y."}],"e":"Cechami sprzężonymi z płcią nazywamy cechy, które nie dotyczą płci, ale są kodowane przez geny w chromosomie X. Należą do nich na przykład hemofilia i daltonizm. Nie są to cechy decydujące o płci.","multiple":false,"q":"Co to są cechy sprzężone z płcią?"},{"answers":[{"c":false,"t":"Ponieważ chromosom Y zawiera wadliwe allele tych chorób."},{"c":false,"t":"Ponieważ dziedziczą chromosom X po ojcu, który zawsze jest chory."},{"c":false,"t":"Ponieważ allele w chromosomie X są u mężczyzn zawsze recesywne."},{"c":true,"t":"Ponieważ mają tylko jeden chromosom X, a w chromosomie Y nie ma odpowiadającego mu allelu."}],"e":"Mężczyzna ma jeden chromosom X, więc każdy allel w tym chromosomie się ujawnia, także recesywny. W chromosomie Y nie ma allelu, który mógłby go „zasłonić”. Chromosom X mężczyzna dziedziczy po matce, a nie po ojcu.","multiple":false,"q":"Dlaczego mężczyźni częściej niż kobiety chorują na recesywne choroby sprzężone z płcią?"},{"answers":[{"c":false,"t":"Gdy wadliwy allel znajduje się w jednym z jej chromosomów X."},{"c":true,"t":"Gdy wadliwy allel znajduje się w obu jej chromosomach X."},{"c":false,"t":"Gdy jest heterozygotą pod względem tego genu."},{"c":false,"t":"Gdy jej ojciec jest zdrowy, a matka jest nosicielką."}],"e":"U kobiety recesywna cecha sprzężona z płcią ujawnia się tylko wtedy, gdy kobieta jest homozygotą recesywną, czyli ma wadliwy allel w obu chromosomach X. Heterozygota z jednym wadliwym allelem jest nosicielką i nie choruje.","multiple":false,"q":"W jakiej sytuacji kobieta choruje na recesywną chorobę sprzężoną z płcią?"},{"answers":[{"c":false,"t":"Kobietę, która jest homozygotą recesywną i choruje."},{"c":false,"t":"Kobietę, która ma w obu chromosomach X prawidłowy allel."},{"c":true,"t":"Kobietę, która jest heterozygotą i może przekazać wadliwy allel potomstwu, choć sama nie choruje."},{"c":false,"t":"Mężczyznę, który ma wadliwy allel w chromosomie Y."}],"e":"Nosicielka to kobieta heterozygotyczna. Cecha recesywna się u niej nie ujawnia, ale kobieta może przekazać recesywny allel swoim dzieciom. Kobieta z dwoma wadliwymi allelami nie jest nosicielką, tylko choruje.","multiple":false,"q":"Kogo nazywamy nosicielką choroby sprzężonej z płcią?"},{"answers":[{"c":false,"t":"Na daltonizm."},{"c":true,"t":"Na hemofilię."},{"c":false,"t":"Na chorobę związaną z chromosomem Y."},{"c":false,"t":"Na chorobę związaną z chromosomami autosomalnymi."}],"e":"Hemofilia to zaburzenie krzepliwości krwi. Chorzy mogą wykrwawić się nawet z lekkiego skaleczenia. Daltonizm to inna choroba sprzężona z płcią, która dotyczy rozpoznawania barw.","multiple":false,"q":"Chłopiec mocno krwawi nawet po lekkim skaleczeniu, bo jego krew nie ma wystarczającej ilości jednego z czynników krzepnięcia. Na jaką chorobę wskazują te objawy?"},{"answers":[{"c":false,"t":"Brak jednego z czynników krzepnięcia krwi."},{"c":false,"t":"Zbyt mała liczba chromosomów autosomalnych."},{"c":false,"t":"Uszkodzenie genów w chromosomie Y."},{"c":true,"t":"Nieprawidłowa synteza barwników w czopkach, wrażliwych na fale świetlne określonej długości."}],"e":"Daltonizm to zaburzenie rozpoznawania barw, głównie czerwonej i zielonej. Wywołuje go nieprawidłowa synteza barwników w czopkach. Brak czynnika krzepnięcia jest przyczyną hemofilii, a nie daltonizmu.","multiple":false,"q":"Co jest przyczyną daltonizmu?"},{"answers":[{"c":false,"t":"0%, bo ojciec jest zdrowy."},{"c":false,"t":"25%."},{"c":true,"t":"50%."},{"c":false,"t":"100%."}],"e":"Syn dostaje chromosom Y od ojca, a chromosom X od matki: X^H albo X^h, każdy z prawdopodobieństwem 50%. Dlatego syn jest chory z prawdopodobieństwem 50%. Zdrowie ojca nic tu nie zmienia, bo ojciec przekazuje synowi chromosom Y.","multiple":false,"q":"Matka jest nosicielką hemofilii (X^H X^h), a ojciec jest zdrowy (X^H Y). Jakie jest prawdopodobieństwo, że ich syn będzie chory na hemofilię?"},{"answers":[{"c":false,"t":"Prawdopodobieństwo urodzenia dziecka daltonisty wynosi 50% i może to być dziewczynka albo chłopiec."},{"c":true,"t":"Prawdopodobieństwo urodzenia dziecka daltonisty wynosi 25% i może to być tylko chłopiec."},{"c":false,"t":"Prawdopodobieństwo urodzenia dziecka daltonisty wynosi 25% i może to być tylko dziewczynka."},{"c":false,"t":"Żadne dziecko nie będzie daltonistą, bo oboje rodzice widzą barwy prawidłowo."}],"e":"Krzyżówka daje cztery genotypy: X^D X^D, X^D Y, X^D X^d i X^d Y. Daltonistą jest tylko X^d Y, czyli chłopiec, co stanowi 25%. Córki dostają od taty allel X^D, więc nie chorują, ale mogą być nosicielkami.","multiple":false,"q":"Mama jest nosicielką daltonizmu (X^D X^d), a tata prawidłowo rozpoznaje barwy (X^D Y). Co wynika z krzyżówki?"},{"answers":[{"c":false,"t":"0%."},{"c":true,"t":"25%."},{"c":false,"t":"50%."},{"c":false,"t":"75%."}],"e":"Tata przekazuje gamety X^d i Y, a mama X^D i X^d. Krzyżówka daje genotypy X^D X^d, X^d X^d, X^D Y i X^d Y. Dziewczynką daltonistką jest tylko X^d X^d, czyli jedno z czterech dzieci, co daje 25%. Wynik 50% dotyczyłby samych córek, a nie wszystkich dzieci.","multiple":false,"q":"Mama jest nosicielką daltonizmu (X^D X^d), a tata jest daltonistą (X^d Y). Jakie jest prawdopodobieństwo, że ich dziecko (licząc wszystkie dzieci) będzie dziewczynką daltonistką?"}],"text":{"again":"Spróbuj jeszcze raz","backToChapter":"Wróć do rozdziału","check":"Sprawdź","correct":"Dobrze!","next":"Następne pytanie","progress":"Pytanie {number} z {total}","score":"{score} / {total}","scoreLabel":"Twój wynik","seeResult":"Zobacz wynik","selectAll":"Zaznacz wszystkie poprawne odpowiedzi.","wrong":"Nie tym razem."}}</script>
